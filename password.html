<!DOCTYPE html>
<html>
    <head>
        <title>Password Strength Checker</title>
<style>
    *{
        margin: 0;
        padding: 0; 
        box-sizing: border-box;
    }

    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #050505;
        font-family: Arial, sans-serif;
        color:white;
    }

    .box{
        background-color: #0d0d0d;
        border-radius: 15px;
        border:1px solid #222;
        padding: 40px;
        width: 450px;
        text-align: center;
        box-shadow: 0 0 25px rgba(255,23,68,0.2);

    }

    h1{
        color: #ff1744;
        margin-bottom: 15px;
        text-shadow: 0 0 15px #ff1744;
    }

    p{
        color:#888;
        margin-bottom: 30px;

    }
    input{
        width: 100%;
        padding: 13px;
        background: #050505;
        color:white;
        border-radius: 6px;
        border: 1px solid #333;
        margin-bottom: 15px ;
        outline: none;

    }

    input:focus{
        border-color: #00ff88;
    }

    button{
        padding: 12px 25px;
        background: transparent;
        color: #00ff88;
        border: 1px solid #00ff88;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover{
        background:  #00ff88 ;
        color: #000;
        box-shadow: 0 0 15px #00ff88;

    }

    .result{
       margin-top: 25px;
       color: #00ff88;
       font-size: 18px;
       font-weight: bold;

    }

    .back{
        display: inline-block;
        margin-top: 25px;
        color: #888;
        text-decoration: none;
    }

    .back:hover{
        color: #ff1744;
    }


</style>

    </head>
    <body>
        <div class="box">
        <h1>Password Strength Checker</h1>
        <p>Check the strength of your paassword</p>
        <form method="post">
            <input
            type="password"
            name="password"
            placeholder="Enter your password"required>
            <button type="submit">Check Strength</button>

        </form>
        {% if strength %}
            <div class="result">
                Password strength: {{ strength }}    
            </div>
        {% endif %}
        <a href="/" class="back">Back to Home</a>
        </div>
    </body>
</html>
